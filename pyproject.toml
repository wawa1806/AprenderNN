[project]
name = "nn-zero-to-hero"
version = "0.1.0"
description = "Ejercicios del curso Neural Networks: Zero to Hero (Andrej Karpathy)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "numpy",
    "matplotlib",
    "graphviz",
    "tiktoken",
    "jupyterlab",
    "ipykernel",
    "ipywidgets",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
